name: brb_tracker
description: Android-first VOD break analysis and review.
publish_to: none
version: 0.4.0+6
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/fonts/barlow-OFL.txt
    - assets/fonts/plex-OFL.txt
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/barlow-condensed-extrabold.ttf
          weight: 800
    - family: Plex
      fonts:
        - asset: assets/fonts/plex-mono.ttf
