[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brb-tracker"
version = "0.1.0"
description = "Android-first VOD break detection and review"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "Pillow>=11,<14", "pytesseract>=0.3.13,<1", "yt-dlp[default]>=2026.3.17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
transcribe = ["faster-whisper>=1.1,<2"]

[project.scripts]
brb-tracker = "brb_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["analyzer"]

[tool.pytest.ini_options]
pythonpath = ["analyzer"]
testpaths = ["tests"]
