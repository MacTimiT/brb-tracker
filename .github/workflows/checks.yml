name: Checks and Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: node --check docs/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Native Android unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Enable Android emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise local OCR and downloader on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: apps/mobile/android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload phone-only APK
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: brb-tracker-android-local-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          compression-level: 0
      - name: Android native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-reports
          path: |
            apps/mobile/build/app/reports/androidTests/
            apps/mobile/build/app/reports/tests/
