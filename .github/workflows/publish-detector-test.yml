name: Publish isolated detector test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build separate test app
        working-directory: apps/mobile
        env:
          ORG_GRADLE_PROJECT_brbIsolatedPreview: 'true'
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Verify and publish test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk release/brb-tracker-detector-test.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging release/brb-tracker-detector-test.apk | grep "package: name='dev.mactimit.brb_tracker.test'"
          "$tools/apksigner" verify release/brb-tracker-detector-test.apk
          "$tools/zipalign" -c -P 16 4 release/brb-tracker-detector-test.apk
          (cd release && sha256sum brb-tracker-detector-test.apk > brb-tracker-detector-test.apk.sha256)
          checks_id=$(gh run list --workflow checks.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$checks_id"
          gh run watch "$checks_id" --exit-status --interval 15
          cat > release/notes.md <<'NOTES'
          Install the APK and open **BRB Tracker Test**. It installs alongside the existing app and keeps separate reports, so no uninstall is needed.

          This build adds **Check saved BRB screenshot** on the home screen. Choose the clean BRB screenshot without player controls. It displays the red mask and raw OCR text at the original and 640-pixel widths; use Copy OCR details and share a screenshot of the mask. No full VOD rescan is needed for this check. Images stay on the phone and are not added to public reports.

          The earlier OCR retry still missed the BRB at 1:43:55 in https://www.youtube.com/live/9YP_ljMuDQM. This is a diagnostic build to establish what the phone OCR actually reads, not a claim that the VOD miss is fixed.

          Requires 64-bit Android 8.0+. This is a temporary debug test with a separate package. Future test builds may not install as updates. Keep the original app if you need its reports. Permanent signing remains pending repository Actions secrets.

          Source and GPL-3.0/dependency notices are available at this tag.
          NOTES
          gh release create v0.4.0-detector-test.2 release/brb-tracker-detector-test.apk release/brb-tracker-detector-test.apk.sha256 --target "$GITHUB_SHA" --prerelease --title 'BRB screenshot diagnostic · no full rescan needed' --notes-file release/notes.md
