name: Publish isolated detector test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build separate test app
        working-directory: apps/mobile
        env:
          ORG_GRADLE_PROJECT_brbIsolatedPreview: 'true'
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Verify and publish test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk release/brb-tracker-detector-test.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging release/brb-tracker-detector-test.apk | grep "package: name='dev.mactimit.brb_tracker.test'"
          "$tools/apksigner" verify release/brb-tracker-detector-test.apk
          "$tools/zipalign" -c -P 16 4 release/brb-tracker-detector-test.apk
          (cd release && sha256sum brb-tracker-detector-test.apk > brb-tracker-detector-test.apk.sha256)
          checks_id=$(gh run list --workflow checks.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$checks_id"
          gh run watch "$checks_id" --exit-status --interval 15
          cat > release/notes.md <<'NOTES'
          Uninstall only the previous **BRB Tracker Test** before installing this APK if Android rejects the update. Keep the original **BRB Tracker** installed with its reports. This separate test package keeps its own data.

          This build adds **Check VOD frame at timestamp**. Enter the VOD URL, tap that button, and use 1:43:55. The app downloads the selected video if needed, then checks only that timestamp using the same Android decoder as the full scan. It skips full-VOD analysis, captions and speech processing. Open the completed frame job to see the decoded image, red mask and raw OCR text. Share the image and copied OCR details. These images stay on the phone and are not added to public reports.

          The saved screenshot was recognized correctly on the user's phone, while the full VOD scan found nothing. This diagnostic checks the actual decoded VOD frame to investigate that difference. Detection of the VOD remains unresolved.

          Requires 64-bit Android 8.0+. This is a temporary debug test with a separate package. Future test builds may not install as updates. Keep the original app if you need its reports. Permanent signing remains pending repository Actions secrets.

          Source and GPL-3.0/dependency notices are available at this tag.
          NOTES
          gh release create v0.4.0-detector-test.3 release/brb-tracker-detector-test.apk release/brb-tracker-detector-test.apk.sha256 --target "$GITHUB_SHA" --prerelease --title 'BRB VOD-frame diagnostic · inspect 1:43:55' --notes-file release/notes.md
