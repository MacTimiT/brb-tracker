name: Publish Android preview download
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Checks and Android APK run on main
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the Android build passed
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.SOURCE_RUN_ID)
            });
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/checks.yml') {
              throw new Error('The Android checks run is not verified.');
            }
            core.setOutput('commit', run.head_sha);
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: brb-tracker-android-local-debug
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Prepare phone download
        run: |
          mv release/app-debug.apk release/brb-tracker-0.3.0-android.apk
          cd release
          sha256sum brb-tracker-0.3.0-android.apk > brb-tracker-0.3.0-android.apk.sha256
          cat > notes.md <<'NOTES'
          Android v0.3.0 preview: process VODs on the phone without a PC or analysis server.

          Download the .apk file under Assets below, then open it on Android to install.

          - On-device YouTube/local-video processing, OCR, break timing, transcript-based reason suggestions and saved corrections.
          - Video-only downloads, optional 360p quality, fast 5s scanning with 1s transition refinement, and exact banner OCR caching.
          - Original VOD date and separate analysis timestamp in reports and dashboard exports.
          - GONE4HOPE admin interface; no sample report or promotional text.
          - Gamin4Hope red bottom-left BRB banner mode, with full-frame fallback.
          - Publish reviewed report JSON from the phone to the GitHub Pages dashboard.

          Requires a 64-bit Android phone running Android 8.0 or newer. This is a debug preview, not a Play Store release. If Android refuses an update because signing keys differ, uninstall the earlier debug APK first after preserving any local reports you need.

          Static checks, Python/Flutter/native unit tests, and Android emulator tests passed for the source build. Actual YouTube access and full-VOD accuracy still need validation on the user's phone. Missing captions leave reasons Unknown until manually corrected; speech-to-text is not bundled.

          GitHub publishing uses a repository-scoped personal access token with Contents read/write, entered in the app's cloud/upload settings. Never enter the token in a chat.

          Android source and GPL-3.0/dependency notices are included in this repository at the release tag. The bundled dashboard example statistics are invented sample data.
          NOTES
      - name: Publish preview release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create v0.3.0-preview \
            release/brb-tracker-0.3.0-android.apk \
            release/brb-tracker-0.3.0-android.apk.sha256 \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --title 'Android v0.3.0 · On-device analysis preview' \
            --notes-file release/notes.md
