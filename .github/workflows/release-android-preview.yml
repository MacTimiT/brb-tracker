name: Publish signed Android preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Checks and Android APK run on main
        required: true
        type: string
      tag:
        description: Version tag matching pubspec.yaml, such as v0.4.1-preview
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the Android build passed
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.SOURCE_RUN_ID)
            });
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/checks.yml') {
              throw new Error('The Android checks run is not verified.');
            }
            core.setOutput('commit', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {split($2,a,"+"); print a[1]}' apps/mobile/pubspec.yaml)
          test -n "$version"
          test "$RELEASE_TAG" = "v${version}-preview"
          echo "BRB_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Load stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BRB_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRB_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo '::error::Configure BRB_ANDROID_KEYSTORE_BASE64 and BRB_ANDROID_KEYSTORE_PASSWORD as repository Actions secrets.'
            exit 1
          fi
          key_file="$RUNNER_TEMP/brb-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "BRB_SIGNING_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build signed preview APK
        working-directory: apps/mobile
        env:
          BRB_SIGNING_PASSWORD: ${{ secrets.BRB_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Verify signed APK and prepare notes
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/brb-tracker-${BRB_RELEASE_VERSION}-android.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" > release/signature.txt
          fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/signature.txt)
          test -n "$fingerprint"
          (cd release && sha256sum "brb-tracker-${BRB_RELEASE_VERSION}-android.apk" > "brb-tracker-${BRB_RELEASE_VERSION}-android.apk.sha256")
          cat > release/notes.md <<NOTES
          Android ${BRB_RELEASE_VERSION} signed preview. Download the APK under Assets and open it on a 64-bit Android 8.0+ phone.

          Future previews signed with this same key can install as updates. Earlier previews through v0.4.0 used different debug signing keys, so they require one uninstall before installing this signed version. Preserve any local reports first; uninstalling removes app data and the saved GitHub token. This preview remains debuggable for report migration with adb run-as.

          Signing certificate SHA-256: ${fingerprint}

          The app processes VODs locally. If captions are missing, optional English speech recognition uses a model downloaded on first use. Actual YouTube access and full-VOD accuracy still need validation on a physical phone.

          Source and GPL-3.0/dependency notices are available at this release tag.
          NOTES
      - name: Publish signed preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create "$RELEASE_TAG" "release/brb-tracker-${BRB_RELEASE_VERSION}-android.apk" "release/brb-tracker-${BRB_RELEASE_VERSION}-android.apk.sha256" --target "$SOURCE_COMMIT" --prerelease --title "Android ${BRB_RELEASE_VERSION} · Signed preview" --notes-file release/notes.md
