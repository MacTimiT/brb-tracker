name: Windows app
on:
  push:
    branches: ['**']
    paths:
      - 'apps/windows/**'
      - 'analyzer/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
    tags: ['windows-v*']
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'analyzer/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: ./apps/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BRB-Tracker-Windows-x64
          path: apps/windows/build/package/BRB-Tracker-Windows-x64.zip*
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BRB-Tracker-Windows-x64
      - name: Publish Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c BRB-Tracker-Windows-x64.zip.sha256
          gh release create "$RELEASE_TAG" BRB-Tracker-Windows-x64.zip BRB-Tracker-Windows-x64.zip.sha256 \
            --verify-tag --title "BRB Tracker for Windows ${RELEASE_TAG#windows-v}" --prerelease --latest=false \
            --notes "Extract the ZIP and open brb_tracker_windows.exe. Set a media download cap in Mbps, then download and scan a YouTube VOD or choose a local video. Includes the local scanning tools. Windows 10 or 11 (x64)."
